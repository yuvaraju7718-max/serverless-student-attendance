<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Serverless Student Attendance System</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDKs (Compat for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #f1f5f9; justify-content: center; align-items: center;">

  <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="nav-brand" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;">
        🎓 Cloud Attendance
      </a>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your credentials to access your dashboard</p>
    </div>

    <div class="card" style="padding: 2rem;">
      <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem;">Sign In</h2>

      <div id="errorAlert" class="alert alert-danger"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g. username@clg.ac.in" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
              style="padding-right: 2.75rem;"
            />
            <button 
              type="button" 
              id="togglePasswordBtn" 
              aria-label="Show password" 
              title="Show password"
              style="position: absolute; right: 0.6rem; background: none; border: none; cursor: pointer; padding: 0.35rem; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: color 0.15s ease;"
              onmouseenter="this.style.color='var(--primary)'"
              onmouseleave="if (document.getElementById('password').type === 'password') this.style.color='var(--text-muted)'"
            >
              <svg id="eyeIconSvg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
        &larr; Back to Home
      </a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorAlert = document.getElementById("errorAlert");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    const eyeOpenSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    `;

    const eyeClosedSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    `;

    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.getAttribute("type") === "password";
      if (isPassword) {
        passwordInput.setAttribute("type", "text");
        togglePasswordBtn.innerHTML = eyeClosedSvg;
        togglePasswordBtn.setAttribute("aria-label", "Hide password");
        togglePasswordBtn.setAttribute("title", "Hide password");
        togglePasswordBtn.style.color = "var(--primary)";
      } else {
        passwordInput.setAttribute("type", "password");
        togglePasswordBtn.innerHTML = eyeOpenSvg;
        togglePasswordBtn.setAttribute("aria-label", "Show password");
        togglePasswordBtn.setAttribute("title", "Show password");
        togglePasswordBtn.style.color = "var(--text-muted)";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.className = "alert alert-danger";
      errorAlert.textContent = "";

      const email = document.getElementById("email").value;
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying credentials...";

      try {
        await loginUser(email, password);
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
