<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Serverless Student Attendance System</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDKs (Compat for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #f1f5f9; justify-content: center; align-items: center;">

  <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="nav-brand" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;">
        🎓 Cloud Attendance
      </a>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your credentials to access your dashboard</p>
    </div>

    <div class="card" style="padding: 2rem;">
      <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem;">Sign In</h2>

      <div id="errorAlert" class="alert alert-danger"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g. username@clg.ac.in" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
              style="padding-right: 2.75rem;"
            />
            <button 
              type="button" 
              id="togglePasswordBtn" 
              aria-label="Show password" 
              title="Show password"
              style="position: absolute; right: 0.6rem; background: none; border: none; cursor: pointer; padding: 0.35rem; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: color 0.15s ease;"
              onmouseenter="this.style.color='var(--primary)'"
              onmouseleave="if (document.getElementById('password').type === 'password') this.style.color='var(--text-muted)'"
            >
              <svg id="eyeIconSvg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="display: flex; align-items: center; margin: 1.5rem 0 1.25rem 0; color: var(--text-muted); font-size: 0.8rem;">
        <hr style="flex: 1; border: none; border-top: 1px solid var(--border);" />
        <span style="padding: 0 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500;">or</span>
        <hr style="flex: 1; border: none; border-top: 1px solid var(--border);" />
      </div>

      <!-- Google Sign In Button (Placed at Bottom) -->
      <button 
        type="button" 
        id="googleLoginBtn" 
        class="btn" 
        style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; font-weight: 600; padding: 0.65rem 1rem; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; font-size: 0.95rem; transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;"
        onmouseenter="this.style.backgroundColor='#f8fafc'; this.style.borderColor='#94a3b8'; this.style.boxShadow='0 2px 4px rgba(0,0,0,0.08)';"
        onmouseleave="this.style.backgroundColor='#ffffff'; this.style.borderColor='#cbd5e1'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.05)';"
      >
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="googleLoginText">Sign in with Google</span>
      </button>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
        &larr; Back to Home
      </a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorAlert = document.getElementById("errorAlert");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    const eyeOpenSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    `;

    const eyeClosedSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    `;

    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.getAttribute("type") === "password";
      if (isPassword) {
        passwordInput.setAttribute("type", "text");
        togglePasswordBtn.innerHTML = eyeClosedSvg;
        togglePasswordBtn.setAttribute("aria-label", "Hide password");
        togglePasswordBtn.setAttribute("title", "Hide password");
        togglePasswordBtn.style.color = "var(--primary)";
      } else {
        passwordInput.setAttribute("type", "password");
        togglePasswordBtn.innerHTML = eyeOpenSvg;
        togglePasswordBtn.setAttribute("aria-label", "Show password");
        togglePasswordBtn.setAttribute("title", "Show password");
        togglePasswordBtn.style.color = "var(--text-muted)";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.className = "alert alert-danger";
      errorAlert.textContent = "";

      const email = document.getElementById("email").value;
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying credentials...";

      try {
        await loginUser(email, password);
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });

    const googleLoginBtn = document.getElementById("googleLoginBtn");
    const googleLoginText = document.getElementById("googleLoginText");

    googleLoginBtn.addEventListener("click", async () => {
      errorAlert.className = "alert alert-danger";
      errorAlert.textContent = "";

      googleLoginBtn.disabled = true;
      googleLoginText.textContent = "Connecting to Google...";

      try {
        await loginWithGoogle();
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.add("show");
        googleLoginBtn.disabled = false;
        googleLoginText.textContent = "Sign in with Google";
      }
    });
  </script>
</body>
</html>
