<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Serverless Student Attendance System</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDKs (Compat for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #f1f5f9; justify-content: center; align-items: center;">

  <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="nav-brand" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;">
        🎓 Cloud Attendance
      </a>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your credentials to access your dashboard</p>
    </div>

    <div class="card" style="padding: 2rem;">
      <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem;">Sign In</h2>

      <div id="errorAlert" class="alert alert-danger"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g. username@clg.ac.in" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
        &larr; Back to Home
      </a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorAlert = document.getElementById("errorAlert");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.className = "alert alert-danger";
      errorAlert.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying credentials...";

      try {
        await loginUser(email, password);
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
